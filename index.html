<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Development Quiz</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="quiz-container">
        <div class="quiz-header">
            <span class="quiz-badge">WEB DEVELOPMENT</span>
            <h1>Interactive Quiz</h1>
            <p>Test your knowledge of HTML, CSS and JavaScript.</p>
        </div>
        <div class="quiz-box">
            <div class="quiz-top">
                <span id="question-number">Question 1 of 10</span>
                <span id="score-display">Score: 0</span>
            </div>
            <div class="progress-bar">
                <div id="progress"></div>
            </div>
            <h2 id="question">Question will appear here</h2>
            <div id="answer-buttons">
                <button>Answer 1</button>
                <button>Answer 2</button>
                <button>Answer 3</button>
                <button>Answer 4</button>
            </div>
            <button id="next-button">Next</button>
        </div>
        <footer>
            <p>Built with HTML, CSS & JavaScript</p>
        </footer>
    </main>
    <script src="js/script.js"></script>

</body>
</html>
